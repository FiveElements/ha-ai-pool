name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Several checks (maintenance, vulnerabilities) drift with no commit of ours.
    - cron: "23 6 * * 1"
  # Branch-Protection is re-read whenever the repository's rules change.
  branch_protection_rule:
  workflow_dispatch:

# publish_results refuses a workflow that grants any write scope at the top level.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF to code scanning.
      security-events: write
      # Publish to the public API the README badge reads.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v7
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
