rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: done
    comment: Brand images ship with the integration in custom_components/ai_pool/brand/ (icon.png, icon@2x.png), and icon.png at the repository root is the HACS listing. A home-assistant/brands entry is optional follow-up, not claimed as shipped.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: The integration has no PyPI dependencies; it only calls member entities already set up in Home Assistant.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers. Failover is observed through events documented in the README.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: The pool holds no credentials and opens no connection, so there is nothing to test against. Its only input is a set of entities, which the config flow validates by construction - the EntitySelector is filtered to the pool's domain and excludes the integration's own pool entities - and a pool with no members is refused.
  test-before-setup:
    status: exempt
    comment: The pool holds no credentials and opens no connection, so there is no remote service whose reachability setup could test. Members belong to other integrations and may load after the pool; a missing or unavailable member is a routing status that makes the pool entity unavailable until one returns (entity-unavailable), not a reason to fail setup and retry.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The pool holds no credentials.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: The pool is not a network device and has no discovery information to refresh.
  discovery:
    status: exempt
    comment: Pools are created in the UI from existing member entities; there is nothing to discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: The integration fronts Home Assistant AI entities, not hardware devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Members are configured in the options flow, not discovered after setup.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: Each pool has exactly one service device, created and removed with its config entry. Entities of members that left the pool are pruned on setup.

  # Platinum
  async-dependency:
    status: exempt
    comment: The integration has no external client library.
  inject-websession:
    status: exempt
    comment: The integration has no HTTP client.
  strict-typing: done
